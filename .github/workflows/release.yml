name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build, test, and package
        run: ./tools/release-macos.sh --tag "$GITHUB_REF_NAME" --configure
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release-assets
          path: |
            artifacts/release/*.zip
            artifacts/release/*.sha256
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build, test, and package
        shell: pwsh
        run: ./tools/release-windows.ps1 -Tag $env:GITHUB_REF_NAME -Configure
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: |
            artifacts/release/*.zip
            artifacts/release/*.sha256
          if-no-files-found: error

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build and package documentation
        run: ./tools/build-docs.sh --tag "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: docs-release-assets
          path: |
            artifacts/docs/*.zip
            artifacts/docs/*.sha256
          if-no-files-found: error

  publish:
    needs: [macos, windows, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-release-assets"
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release-assets/* --verify-tag --generate-notes
