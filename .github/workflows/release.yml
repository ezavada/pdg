name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux build and GUI-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake python3 pkg-config xvfb \
            libgl1-mesa-dev libgl1-mesa-dri libglu1-mesa-dev \
            libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev \
            libjpeg-dev libasound2-dev
      - name: Build, test, and package
        run: ./tools/release-linux.sh --tag "$GITHUB_REF_NAME" --configure
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-release-assets
          path: |
            artifacts/release/*.zip
            artifacts/release/*.sha256
          if-no-files-found: error

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build, test, and package
        run: ./tools/release-macos.sh --tag "$GITHUB_REF_NAME" --configure
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release-assets
          path: |
            artifacts/release/*.zip
            artifacts/release/*.sha256
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Windows build dependencies
        shell: pwsh
        run: choco install nasm --yes --no-progress
      - name: Build, test, and package
        shell: pwsh
        run: ./tools/release-windows.ps1 -Tag $env:GITHUB_REF_NAME -Configure
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: |
            artifacts/release/*.zip
            artifacts/release/*.sha256
          if-no-files-found: error

  emscripten:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Emscripten
        run: brew install emscripten
      - name: Build, test, and package
        run: ./tools/release-emscripten.sh --tag "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: emscripten-release-assets
          path: |
            artifacts/release/*.zip
            artifacts/release/*.sha256
          if-no-files-found: error

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build and package documentation
        run: ./tools/build-docs.sh --tag "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: docs-release-assets
          path: |
            artifacts/docs/*.zip
            artifacts/docs/*.sha256
          if-no-files-found: error

  publish:
    needs: [linux, macos, windows, emscripten, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-release-assets"
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release-assets/* --verify-tag --generate-notes
