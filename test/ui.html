<!DOCTYPE html>
<html data-status="running">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="CACHE-CONTROL" content="NO-CACHE">
  <title>PDG UI TEST: RUNNING</title>
  <style>
    body { margin: 0; background: #20252b; color: #f5f7fa; font: 14px sans-serif; }
    #pdg-ui-status { padding: 10px 14px; }
    #pdg-ui-result-json { display: none; }
    #pdg-canvas { display: block; margin: 0 auto; }
    #pdg-ui-suite { display: none; padding: 0 14px 14px; }
    #pdg-ui-suite-frame { width: 100%; height: 950px; border: 1px solid #4c5661; background: #111; }
    #pdg-ui-suite-results { display: flex; flex-wrap: wrap; gap: 8px; padding: 0; list-style: none; }
    #pdg-ui-suite-results li { padding: 5px 8px; background: #343b44; border-radius: 3px; cursor: pointer; }
    #pdg-ui-suite-results li:hover, #pdg-ui-suite-results li:focus { outline: 2px solid #9ecbff; outline-offset: 1px; }
    #pdg-ui-suite-results li.running { background: #745b15; }
    #pdg-ui-suite-results li.passed { background: #216637; }
    #pdg-ui-suite-results li.failed { background: #8a2632; }
  </style>
</head>
<body>
  <div id="pdg-ui-status">Loading WebAssembly…</div>
  <pre id="pdg-ui-result-json"></pre>
  <section id="pdg-ui-suite">
    <ul id="pdg-ui-suite-results"></ul>
    <iframe id="pdg-ui-suite-frame" title="Current PDG UI test"></iframe>
  </section>
  <canvas id="pdg-canvas" width="1200" height="900"></canvas>
  <script>window.Module = { canvas: document.getElementById("pdg-canvas") };</script>
  <script>
    var runner = document.createElement("script");
    runner.src = "emscripten/emscripten_ui_runner.js?_pdg_cache=" + Date.now();
    document.body.appendChild(runner);
  </script>
</body>
</html>
